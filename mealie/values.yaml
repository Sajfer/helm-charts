# Mealie keeps its SQLite database in /app/data, so run exactly one pod and
# stop the old one before the new one starts
replicaCount: 1
strategy: Recreate

image:
  repository: ghcr.io/mealie-recipes/mealie
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Mealie never talks to the Kubernetes API
  automount: false
  annotations: {}
  name: ""

# Public URL, used for links in emails and shared recipes
baseUrl: https://mealie.lab.bretting.se
timezone: Europe/Stockholm
# Accounts are created by the admin; nobody can sign up on their own
allowSignup: false

# Extra environment variables, e.g. OPENAI_API_KEY from a Secret
extraEnv: []
# Whole Secrets/ConfigMaps to load as environment variables
envFrom: []

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 9000

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: homelab-gateway
      namespace: default
  hostnames:
    - mealie.lab.bretting.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

# The first start runs database migrations, which can take a while
startupProbe:
  httpGet:
    path: /api/app/about
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /api/app/about
    port: http
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /api/app/about
    port: http

# /app/data holds the database, recipe images and Mealie's own backups
persistence:
  size: 5Gi

nodeSelector: {}
tolerations: []
affinity: {}
